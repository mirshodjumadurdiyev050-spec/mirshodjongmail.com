<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram RSA Web App</title>
    <!-- Google Fonts va Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f5f6fa;
            --bg-surface: #ffffff;
            --bg-sidebar: #ffffff;
            --text-main: #000000;
            --text-secondary: #707579;
            --border-color: #dfdfe5;
            --primary: #3390ec;
            --primary-hover: #2b7dd0;
            --msg-sent: #e3ffc8;
            --msg-received: #ffffff;
            --shadow: rgba(0,0,0,0.1) 0px 4px 12px;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f0f;
            --bg-surface: #212121;
            --bg-sidebar: #181818;
            --text-main: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2c2c2c;
            --primary: #8774e1;
            --primary-hover: #7362c4;
            --msg-sent: #8774e1;
            --msg-received: #212121;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--bg-surface);
            padding: 40px;
            border-radius: 16px;
            width: 350px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .login-box i { font-size: 50px; color: var(--primary); margin-bottom: 20px; }
        
        input {
            width: 100%; padding: 12px;
            border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-main);
            margin-bottom: 15px; outline: none; font-size: 14px;
        }
        input:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%; padding: 12px; background: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-weight: 500; cursor: pointer; font-size: 16px;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        /* Asosiy Dastur UI */
        .app-container {
            display: flex; width: 100%; max-width: 1600px;
            margin: 0 auto; height: 100%;
            background: var(--bg-surface);
        }

        .sidebar {
            width: 350px; background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
        }

        .sidebar-header {
            padding: 15px; display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .icon-btn {
            background: transparent; border: none; font-size: 18px;
            color: var(--text-secondary); cursor: pointer;
        }
        .icon-btn:hover { color: var(--primary); }

        .search-bar { flex: 1; border-radius: 20px; margin-bottom: 0; }

        .settings-panel {
            padding: 15px; background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: none;
        }
        
        .settings-row {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px; font-size: 14px;
        }
        
        select {
            padding: 5px; background: var(--bg-surface);
            color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: 5px; outline: none;
        }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item {
            display: flex; padding: 12px 15px; gap: 15px;
            cursor: pointer; align-items: center;
        }
        .chat-item.active { background: var(--primary); color: white; }
        .chat-item:hover:not(.active) { background: var(--bg-color); }

        .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: #ff5252; color: white; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }

        .main-chat {
            flex: 1; display: flex; flex-direction: column;
            background: url('https://www.transparenttextures.com/patterns/chat-pattern.png') var(--bg-color);
            position: relative;
        }

        .chat-header {
            background: var(--bg-surface); padding: 12px 20px;
            display: flex; align-items: center; gap: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg-wrapper { max-width: 65%; display: flex; flex-direction: column; }
        .msg-wrapper.sent { align-self: flex-end; }
        .msg-wrapper.received { align-self: flex-start; }

        .msg-bubble {
            padding: 10px 14px; border-radius: 12px; font-size: 15px;
            line-height: 1.4; word-wrap: break-word; box-shadow: var(--shadow);
        }

        .msg-wrapper.sent .msg-bubble {
            background: var(--msg-sent); border-bottom-right-radius: 4px; border: 1px solid transparent;
        }
        [data-theme="dark"] .msg-wrapper.sent .msg-bubble { color: white; }
        
        .msg-wrapper.received .msg-bubble {
            background: var(--msg-received); border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .msg-footer {
            font-size: 11px; margin-top: 4px; text-align: right; color: var(--text-secondary);
        }

        .chat-input-area {
            background: var(--bg-surface); padding: 15px 20px;
            display: flex; gap: 15px; align-items: center;
        }

        .send-btn {
            background: var(--primary); color: white; border: none;
            width: 48px; height: 48px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Kirish Oynasi -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <i class="fa-solid fa-paper-plane"></i>
            <h2 id="t_login_title" style="margin-bottom:20px;">Tizimga kirish</h2>
            <input type="text" id="loginInput" placeholder="Telefon yoki Email...">
            <button class="btn-primary" onclick="login()" id="t_login_btn">Davom etish</button>
        </div>
    </div>

    <!-- Asosiy UI -->
    <div class="app-container" style="display: none;" id="mainApp">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="icon-btn" onclick="toggleSettings()"><i class="fa-solid fa-bars"></i></button>
                <input type="text" class="search-bar" id="t_search" placeholder="Qidirish...">
            </div>
            
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-row">
                    <span id="t_theme">Oq / Qora mavzu</span>
                    <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                </div>
                <div class="settings-row">
                    <span id="t_lang">Tilni o'zgartirish</span>
                    <select id="langSelect" onchange="changeLang(this.value)">
                        <option value="uz">O'zbekcha</option>
                        <option value="en">English</option>
                        <option value="ru">Русский</option>
                    </select>
                </div>
                <div style="font-size:12px; color: var(--text-secondary); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color);">
                    <b>RSA Kalitlaringiz <i class="fa-solid fa-key"></i>:</b><br>
                    Public (Ochiq): e=<span id="pub_e"></span>, n=<span id="pub_n"></span><br>
                    Private (Maxfiy): d=<span id="priv_d"></span>
                </div>
            </div>

            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar">H</div>
                    <div>
                        <div style="font-weight: 500;">Hojiakbar (Hamkor)</div>
                        <div style="font-size: 13px; color: #fff;" id="t_status">RSA shifrlangan chat</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div class="avatar" style="width: 40px; height: 40px; font-size: 16px;">H</div>
                <div>
                    <div style="font-weight: 500;">Hojiakbar (Hamkor)</div>
                    <div style="font-size: 12px; color: var(--primary);"><i class="fa-solid fa-lock"></i> End-to-End Encrypted</div>
                </div>
            </div>

            <div class="chat-messages" id="messagesArea">
                <!-- Xabarlar shu yerga tushadi -->
            </div>

            <div class="chat-input-area">
                <button class="icon-btn"><i class="fa-regular fa-face-smile"></i></button>
                <input type="text" id="msgInput" class="search-bar" placeholder="Xabar yozing..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- TARJIMALAR (i18n) ---
        const langs = {
            uz: {
                login_title: "Tizimga kirish", login_btn: "Davom etish", search: "Qidirish...",
                theme: "Mavzuni o'zgartirish", lang: "Tilni tanlang", status: "RSA shifrlangan chat",
                input: "Xabar yozing..."
            },
            en: {
                login_title: "Sign In", login_btn: "Continue", search: "Search...",
                theme: "Change Theme", lang: "Select Language", status: "RSA encrypted chat",
                input: "Type a message..."
            },
            ru: {
                login_title: "Войти в систему", login_btn: "Продолжить", search: "Поиск...",
                theme: "Изменить тему", lang: "Выберите язык", status: "Чат RSA шифрование",
                input: "Напишите сообщение..."
            }
        };

        function changeLang(lang) {
            document.getElementById('t_login_title').innerText = langs[lang].login_title;
            document.getElementById('t_login_btn').innerText = langs[lang].login_btn;
            document.getElementById('t_search').placeholder = langs[lang].search;
            document.getElementById('t_theme').innerText = langs[lang].theme;
            document.getElementById('t_lang').innerText = langs[lang].lang;
            document.getElementById('t_status').innerText = langs[lang].status;
            document.getElementById('msgInput').placeholder = langs[lang].input;
        }

        // --- MAVZUNI O'ZGARTIRISH ---
        function toggleTheme() {
            const html = document.documentElement;
            const isLight = html.getAttribute('data-theme') === 'light';
            html.setAttribute('data-theme', isLight ? 'dark' : 'light');
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // --- RSA MATEMATIKASI ---
        let myKeys = {};
        const friendPubKey = { e: 5, n: 3233 }; // Soddalashtirilgan do'st kaliti

        function modPow(base, exp, mod) {
            let result = 1n, b = BigInt(base) % BigInt(mod), e = BigInt(exp);
            while (e > 0n) {
                if (e % 2n === 1n) result = (result * b) % BigInt(mod);
                e /= 2n; b = (b * b) % BigInt(mod);
            }
            return result;
        }

        function gcd(a, b) {
            while (b !== 0) { let t = b; b = a % b; a = t; }
            return a;
        }

        function buildRSA() {
            let p = 61, q = 53;
            let n = p * q, phi = (p - 1) * (q - 1), e = 3;
            while (e < phi) { if (gcd(e, phi) === 1) break; e++; }
            let d = 1;
            while (((d * e) % phi) !== 1) d++;
            myKeys = { pub: {e, n}, priv: {d, n} };
            
            document.getElementById('pub_e').innerText = e;
            document.getElementById('pub_n').innerText = n;
            document.getElementById('priv_d').innerText = d;
        }

        function encrypt(text, pubKey) {
            let cipher = [];
            for (let i = 0; i < text.length; i++) {
                cipher.push(modPow(text.charCodeAt(i), pubKey.e, pubKey.n).toString());
            }
            return cipher.join('-');
        }

        function decrypt(cipherText, privKey) {
            let plain = "";
            let arr = cipherText.split('-');
            for (let i = 0; i < arr.length; i++) {
                if(!arr[i]) continue;
                let c = BigInt(arr[i]);
                plain += String.fromCharCode(Number(modPow(c, privKey.d, privKey.n)));
            }
            return plain;
        }

        // --- LILOVA MANTIQI ---
        function login() {
            const val = document.getElementById('loginInput').value;
            if(!val) return;
            // Login qilganda yashirincha kalitlar yaratiladi
            buildRSA();
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
        }

        function appendMessage(text, type, encText = null) {
            const area = document.getElementById('messagesArea');
            const wrap = document.createElement('div');
            wrap.className = `msg-wrapper ${type}`;
            
            let bubble = `<div class="msg-bubble">${text}</div>`;
            let footer = `<div class="msg-footer">`;
            
            if(encText) {
                footer += `<span style="color:#ff5252; margin-right:5px; font-family: monospace;" title="Tarmoqdagi (Hacker ko'radigan) kod">🔒 ${encText.substring(0, 15)}...</span>`;
            }
            footer += `${type === 'sent' ? '✓✓' : ''} </div>`;
            
            wrap.innerHTML = bubble + footer;
            area.appendChild(wrap);
            area.scrollTop = area.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = "";
            
            // 1. Shifrlash (Hacker tushunolmaydigan qilib do'st qulfi bn qulflash)
            const enc = encrypt(text, friendPubKey);
            appendMessage(text, 'sent', enc);

            // 2. Simulyatsiya: Do'stdan keladigan javob xabari orqaga shifrlanib keladi
            setTimeout(() => {
                const friendReply = "Zo'r ishlayaptiku Web dasturingiz!";
                // P.S: Ularning tizimi bizning public qulf bn yopadi
                const receivedEnc = encrypt(friendReply, myKeys.pub);
                
                // 3. Biz uni Deshifrlaymiz (ochamiz)
                const realText = decrypt(receivedEnc, myKeys.priv);
                appendMessage(realText, 'received', receivedEnc);
            }, 1500);
        }

        // Dastur boshlanganda
        changeLang('uz');
    </script>
</body>
</html>
